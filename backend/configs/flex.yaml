# World for the paper simulator (backend/flex). Every number needs "# source: <ref>, accessed <date>" or "# ASSUMPTION".
# Sections are added phase by phase (S1 paths and seed, S3 power, S4 grid, S6 cloud and cost, S7 deadlines, S11 sources).

paths:                  # relative to the repo root
  data: data            # ASSUMPTION (layout choice, not a number from a source)
  predictions: predictions
  results: results

seed: 1                 # ASSUMPTION: default seed for synthetic runs
lookup_rule: hold_beyond_grid   # ASSUMPTION (decision 2026-11-14, SIM_PLAN S16a): contract | hold_beyond_grid; non-oracle predictions beyond the last grid point (43,200 s) are held at the last row instead of the gap being subtracted (S14b/S14c)
missing_pred: oracle       # ASSUMPTION (W7 robustness): oracle | uninformed; jobs without prediction rows use their true values (oracle) or 30-day remaining runtime with p_fail = p_cancel = 0 (uninformed); never changes the oracle predictor
plan_wf: zero             # ASSUMPTION (W9b variant): zero | match; match plans with q_j + w_f (1 - q_j) using cost.w_fail (default zero = plan as if w_f = 0)
uninformed_submit_before: null   # ASSUMPTION (W4 leakage check): null | date; non-oracle predictors return the uninformed values (30 d, p_fail = p_cancel = 0) for jobs submitted before this date
check_every: 1000       # ASSUMPTION: full safety check every N events on large runs (tests use 1)

synthetic:              # synthetic test data only, never used for paper numbers
  epoch0_utc: "2017-11-15T00:00:00+00:00"   # ASSUMPTION: UTC time of simulated t = 0 on synthetic runs (the Philly TEST_START date, so local-time rules behave alike)
  days: 20              # ASSUMPTION: length of the synthetic trace used by the experiment runner (room for 10 event days)
  pool_gpus: 64         # ASSUMPTION: GPU pool size for synthetic runs (the Philly G comes from the machines table in S8)

cloud:
  min_billed_s: 60      # source: docs/track-2/SIM_PLAN.md D8 (per-second billing, 60 s minimum), accessed 2026-11-13
  max_cloud_gpus: 1000  # source: docs/track-2/SIM_PLAN.md D8 (default cap; sensitivity later), accessed 2026-11-13
  price_per_gpu_h: 3.06 # source: AWS EC2 p3.2xlarge (1 V100) on-demand us-east-1 $3.06/h, read on instances.vantage.sh/aws/ec2/p3.2xlarge (last updated 2026-11-13); confirm on the AWS pricing page before citing. Spot $0.43/h is covered by the E2 price sweep. Accessed 2026-11-13
  boot_delay_s: 300     # source: Mao and Humphrey, IEEE CLOUD 2012, pp. 423-430: VM startup 96.9 s (EC2 Linux), 357-406 s (Azure); 300 s is inside that range plus container/data setup. E2 sweeps 60-900 s. Accessed 2026-11-13
  migrate_s: 120        # ASSUMPTION, bounded by CheckFreq (USENIX FAST 2021) Table 3 (checkpoint stall 3.6 s V100/SSD, 10.7 s 1080Ti/HDD for VGG16; checkpoint sizes 90 MB-5 GB). Includes save, transfer, load and warm-up for <= 1 GB.
  restore_s: 60         # ASSUMPTION, same basis as migrate_s

power:                    # one representative GPU type (D5)
  p_idle_w: 70            # source: Zeus (NSDI 2023) Sec 2.3, measured V100 idle about 70 W (a V100, not Pascal; sensitivity 40-70 W), accessed 2026-11-13
  p_max_w: 250            # source: NVIDIA Tesla P100 PCIe datasheet (250 W max, 12 GB and 16 GB variants; the trace names no GPU model, only 12/24 GB); Tesla M40 datasheet also 250 W. URL: https://nvidia.com/content/dam/en-zz/Solutions/Data-Center/tesla-p100/pdf/nvidia-tesla-p100-PCIe-datasheet.pdf, accessed 2026-11-13
  h_idle_w: 100           # ASSUMPTION (no verified source; sensitivity +-50%)
  h_busy_w: 50            # ASSUMPTION (no verified source; sensitivity +-50%)
  pue: 1.58               # source: Uptime Institute Global Data Center Survey 2023, industry average per site 1.58 (1.47 weighted by IT capacity; sensitivity 1.3-1.6). URL: https://journal.uptimeinstitute.com/large-data-centers-are-mostly-more-efficient-analysis-confirms/, accessed 2026-11-13
  cloud_pue: 1.09         # source: Google datacenters.google/efficiency, fleet-wide average PUE 1.09 for 2025 (E5 only). URL: https://www.datacenters.google/efficiency, accessed 2026-11-13

cap_curve:                # speed as a function of r = f * P_max / P_uncapped(u), piecewise linear (D9); r >= 1 means speed 1
  variant: optimistic     # keep: favours capping, so it is the conservative choice for the claim that burst can win; pessimistic is shown in T4
  # Anchor point from Patel et al. (ASPLOS 2024) Sec 4.1, A100 training: about 22% less server power for about 10% slower, i.e. r about 0.78, speed about 0.90, between our two curves. The curve points themselves stay ASSUMPTION (not taken from a paper).
  optimistic:             # ASSUMPTION ([r, speed] points)
    - [0.3, 0.55]
    - [0.5, 0.80]
    - [0.7, 0.93]
    - [1.0, 1.0]
  # Anchor point from Patel et al. (ASPLOS 2024) Sec 4.1, A100 training: about 22% less server power for about 10% slower, i.e. r about 0.78, speed about 0.90, between our two curves. The curve points themselves stay ASSUMPTION (not taken from a paper).
  pessimistic:            # ASSUMPTION ([r, speed] points)
    - [0.3, 0.30]
    - [0.5, 0.55]
    - [0.7, 0.80]
    - [1.0, 1.0]

grid:                     # curtailment events (D13) and the paired-run horizon (D6)
  durations_h: [1, 2, 4]  # source: docs/track-2/SIM_PLAN.md D13, accessed 2026-11-13
  cuts: [0.1, 0.2, 0.3]   # source: docs/track-2/SIM_PLAN.md D13, accessed 2026-11-13
  events_per_cell: 10     # source: docs/track-2/SIM_PLAN.md D13 (10 events per duration x cut), accessed 2026-11-13
  slot_minutes: 30        # source: docs/track-2/SIM_PLAN.md D13 (a random half hour), accessed 2026-11-13
  start_hour_min: 17      # source: docs/track-2/SIM_PLAN.md D13 (17:00 America/Los_Angeles), accessed 2026-11-13
  start_hour_max: 20      # source: docs/track-2/SIM_PLAN.md D13 (start slots before 20:00), accessed 2026-11-13
  skip_first_days: 2      # source: docs/track-2/SIM_PLAN.md D13 (only on days >= 2 after the window start), accessed 2026-11-13
  end_margin_days: 1      # source: docs/track-2/SIM_PLAN.md D13 (end before window end - 1 day), accessed 2026-11-13
  h_after_h: 24           # source: docs/track-2/SIM_PLAN.md D6 (default H_after), accessed 2026-11-13

cap_levels: [1.0, 0.9, 0.8, 0.7, 0.6]   # source: docs/track-2/SIM_PLAN.md D9 (cluster-wide cap levels x P_max), accessed 2026-11-13

cost:                     # cost of an event (D7)
  c_delay_factor: 1.0     # source: docs/track-2/SIM_PLAN.md D7 (c_delay = the cloud $/GPU-hour; sensitivity 0.5x and 2x), accessed 2026-11-13
  m: 1                    # source: docs/track-2/SIM_PLAN.md D7 (missed-deadline multiplier; sensitivity 0 and 3), accessed 2026-11-13
  w_fail: 0               # source: docs/track-2/SIM_PLAN.md D7 (delay weight of Failed/Killed jobs; sensitivity 1), accessed 2026-11-13

deadlines:               # D12: a seeded random share of jobs gets deadline = submit + slack x wall_s
  fraction: 0.3          # source: docs/track-2/SIM_PLAN.md D12, accessed 2026-11-13
  slack_min: 2           # source: docs/track-2/SIM_PLAN.md D12 (slack ~ U(2, 4)), accessed 2026-11-13
  slack_max: 4           # source: docs/track-2/SIM_PLAN.md D12, accessed 2026-11-13

philly:                  # real-trace loader (S8)
  warmup_days: 7         # ASSUMPTION: the simulation starts this many days before TEST_START so the queue and pool are filled by the window start
  util_default: 0.5      # ASSUMPTION: used for every job only when philly_job_util.parquet (S9) is absent; otherwise unmeasured jobs get the measured cluster average
  pool_gpus: auto        # derived: median non-NA GPU count per minute over the test window (cluster_gpu_util, S9c); an integer overrides it (used for the sensitivity). Derived from the trace, not tuned on waits.

carbon:                   # E5 side check: annual AVERAGE CO2 emission rates, g CO2 per kWh (average, not marginal)
  # All four: US EPA, eGRID2023 Summary Tables (rev1, produced 2025-01-17), Table 1, total CO2 output emission rate. URL: https://www.epa.gov/system/files/documents/2025-01/egrid2023_summary_tables_rev1.pdf , accessed 2026-11-15. lb/MWh x 0.45359 = g/kWh.
  # Average not marginal; subregion NWPP/SRVC/RFCW is the eGRID subregion that contains the AWS region, a mapping we chose.
  local_camx: 198.1       # source: eGRID2023 Table 1, CAMX 436.7 lb/MWh; the grid where the events happen (California), accessed 2026-11-15
  cloud_us_west_2: 286.5  # source: eGRID2023 Table 1, NWPP 631.7 lb/MWh (subregion mapping chosen by us), accessed 2026-11-15
  cloud_us_east_1: 267.7  # source: eGRID2023 Table 1, SRVC 590.2 lb/MWh (subregion mapping chosen by us), accessed 2026-11-15
  cloud_us_east_2: 413.4  # source: eGRID2023 Table 1, RFCW 911.3 lb/MWh (subregion mapping chosen by us), accessed 2026-11-15
